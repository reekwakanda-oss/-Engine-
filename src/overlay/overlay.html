<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: blob: data:; style-src 'self' 'unsafe-inline'" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      #stage.dragging {
        cursor: grabbing;
      }
      .crisp {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script src="background.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
